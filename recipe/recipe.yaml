# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.17.3"

recipe:
  name: ruff-split
  version: ${{ version }}

source:
  url: https://github.com/astral-sh/ruff/archive/refs/tags/${{ version }}.tar.gz
  sha256: 7281befde89b669bd92231064ceb3d3211d9094e20e6983bb3b92e641b305860
  patches:
    # let `ruff.find_ruff_bin()` find the executable in `%PREFIX%\Library\bin`
    - find-ruff-conda-windows.patch

build:
  number: 1

outputs:
  - package:
      name: ruff
    build:
      script:
        env:
          JEMALLOC_SYS_WITH_LG_PAGE: ${{ '16' if aarch64 else '' }}
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: fat
        content:
          # rust-lld cannot handle some ppc64le relocations emitted by the jemalloc
          # C sources, so fall back to the bfd linker there
          - if: target_platform == "linux-ppc64le"
            then: export CARGO_BUILD_RUSTFLAGS="${CARGO_BUILD_RUSTFLAGS:-} -C link-arg=-fuse-ld=bfd"
          - if: unix
            then:
              - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path crates/ruff
            else:
              - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .\crates\ruff
          - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
          - if: unix
            then:
              - mkdir -p $PREFIX/share/zsh/site-functions $PREFIX/share/bash-completion/completions $PREFIX/share/fish/vendor_completions.d
              - $PREFIX/bin/ruff generate-shell-completion zsh > $PREFIX/share/zsh/site-functions/_ruff
              - $PREFIX/bin/ruff generate-shell-completion bash > $PREFIX/share/bash-completion/completions/ruff
              - $PREFIX/bin/ruff generate-shell-completion fish > $PREFIX/share/fish/vendor_completions.d/ruff.fish

    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('rust') }}
        - cargo-bundle-licenses
        - cargo-auditable
        - if: unix
          then: make

    tests:
      - package_contents:
          bin:
            - ruff
          files:
            - if: unix
              then:
                - share/bash-completion/completions/ruff
                - share/fish/vendor_completions.d/ruff.fish
                - share/zsh/site-functions/_ruff
          strict: true
      - script:
          - ruff --version
          - ruff --help

  - package:
      name: python-ruff
    build:
      noarch: python
      # the noarch package only needs to be built (and tested) once per native
      # platform; skip the cross-compiled configurations
      skip: build_platform != target_platform
      script:
        - if: unix
          then: cp ${{ RECIPE_DIR }}/python-ruff/pyproject.toml python/pyproject.toml
          else: copy %RECIPE_DIR%\python-ruff\pyproject.toml python\pyproject.toml
        - ${{ PYTHON }} -m pip install -vv --no-deps --no-build-isolation ./python
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - hatchling
      run:
        - python >=${{ python_min }}
        # use the ruff executable from the `ruff` output; the version is pinned
        # without the build string since this package is noarch
        - ruff ==${{ version }}
    tests:
      - python:
          imports:
            - ruff
          python_version:
            - ${{ python_min }}.*
            - "*"
      - requirements:
          run:
            - python ${{ python_min }}.*
        script:
          - python -m ruff --version
          - python -m ruff --help
          - python -c "import ruff, os; p = ruff.find_ruff_bin(); print(p); assert os.path.isfile(p)"
    about:
      license: MIT
      license_file:
        - LICENSE
      summary: Python package to locate and run the ruff executable (`import ruff`, `python -m ruff`).

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
    - crates/ruff_unicode_names2/LICENSE-MIT
    - crates/ruff_unicode_names2/data/LICENSE-UNICODE
  summary: An extremely fast Python linter, written in Rust.
  description: |
    An extremely fast Python linter, written in Rust. Ruff can be used to
    replace Flake8 (plus a variety of plugins), isort, pydocstyle, yesqa, and
    even a subset of pyupgrade and autoflake all while executing tens or
    hundreds of times faster than any individual tool.
  homepage: https://github.com/astral-sh/ruff
  documentation: https://docs.astral.sh/ruff
  repository: https://github.com/astral-sh/ruff

extra:
  feedstock-name: ruff
  recipe-maintainers:
    - dhruvmanila
    - ntBre
    - zanieb
    - messense
    - charliermarsh
